[package]
name = "metal-live-resize"
version = "0.1.0"
description = "Glitch-free macOS Metal window live resize via CAMetalLayer contentsGravity + contentsScale"
keywords = ["macos", "metal", "window", "resize", "cametallayer"]
categories = ["graphics", "gui", "os::macos-apis"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/metal-live-resize"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
winit = "0.30"
raw-window-handle = "0.6"
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer"] }

[[example]]
name = "resize_demo"
required-features = []
